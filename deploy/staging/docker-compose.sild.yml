#
# DEP-1 — SILD-Staging-Deploy (Interop-Demo), Mechanismus A (Snapshot-Pull).
#
# Kette:  MLLP-Ingest (persist-before-ack) -> M-1 -> M-2 (WAL) -> Snapshot-Publisher
# Pull:   AION liest /srv/sild/data/m2_pull.db READ-ONLY (separater aion-api-Mount,
#         siehe deploy/staging/BOOTSTRAP.md — beruehrt /srv/aionprod, NICHT hier).
#
# Laeuft als das `sild`-Konto (NICHT root): SILD_UID/SILD_GID via .env setzen
# (vom Bootstrap-Rezept geliefert). Alle Dienste teilen /data = /srv/sild/data.
#
# WICHTIG: nur synthetische Daten. Keine Tabu-Zonen.

services:
  # 1) Ingest: HL7-v2-MLLP -> persist-before-ack -> intake.db
  sild-filter:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.sild
    image: sild-stack/sild-chain:dep1
    container_name: sild-filter
    user: "${SILD_UID}:${SILD_GID}"
    restart: unless-stopped
    command: ["python", "-u", "sild_mllp_filter.py",
              "--listen", "2575",
              "--durable-store", "/data/intake.db",
              "--log", "/data/logs/sild_reports.jsonl"]
    ports:
      - "127.0.0.1:2575:2575"      # nur lokal — Demo-Sender auf der Box
    volumes:
      - /srv/sild/data:/data
    networks: [sild-net]

  # 2) M-1: sichtet intake.db (read-only) -> m1.db
  sild-m1:
    image: sild-stack/sild-chain:dep1
    container_name: sild-m1
    user: "${SILD_UID}:${SILD_GID}"
    restart: unless-stopped
    depends_on: [sild-filter]
    command: ["python", "-u", "sild_mapper_m1.py",
              "--intake-db", "/data/intake.db",
              "--mapper-db", "/data/m1.db",
              "--poll-interval", "5"]
    volumes:
      - /srv/sild/data:/data
    networks: [sild-net]

  # 3) M-2: baut Intervalle -> m2.db (WAL) mit den v_aion_*-Views
  sild-m2:
    image: sild-stack/sild-chain:dep1
    container_name: sild-m2
    user: "${SILD_UID}:${SILD_GID}"
    restart: unless-stopped
    depends_on: [sild-m1]
    command: ["python", "-u", "sild_mapper_m2.py",
              "--m1-db", "/data/m1.db",
              "--intake-db", "/data/intake.db",
              "--m2-db", "/data/m2.db",
              "--poll-interval", "5"]
    volumes:
      - /srv/sild/data:/data
    networks: [sild-net]

  # 4) Snapshot-Publisher (DEP-S2 Mechanismus A): m2.db -> m2_pull.db (atomar)
  #    self-contained, journal_mode=delete, 0644 (uid-1000/aion-lesbar).
  sild-snapshot:
    image: sild-stack/sild-chain:dep1
    container_name: sild-snapshot
    user: "${SILD_UID}:${SILD_GID}"
    restart: unless-stopped
    depends_on: [sild-m2]
    command: ["python", "-u", "sild_m2_snapshot.py",
              "--m2-db", "/data/m2.db",
              "--out",   "/data/m2_pull.db",
              "--interval", "10"]          # demo-wahrnehmbar; Trigger s. BOOTSTRAP.md
    volumes:
      - /srv/sild/data:/data
    networks: [sild-net]

networks:
  sild-net:
    name: sild-net
