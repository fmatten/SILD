services:

  # ===== Mock-AION-MLLP-Empfaenger =====
  aion-mock:
    build: .
    image: sild-stack/sild-services:latest
    container_name: sild-aion-mock
    restart: unless-stopped
    command: ["python", "-u", "sild_mllp_target.py", "--listen", "2576"]
    ports:
      - "2576:2576"
    networks: [sild-net]

  # ===== Mock-AION-FHIR-Empfaenger =====
  aion-fhir-mock:
    build: .
    image: sild-stack/sild-services:latest
    container_name: sild-aion-fhir-mock
    restart: unless-stopped
    command: ["python", "-u", "sild_fhir_target.py", "--listen", "8081"]
    ports:
      - "8081:8081"
    networks: [sild-net]

  # ===== SILD-Filter HL7v2/MLLP =====
  sild-filter:
    build: .
    image: sild-stack/sild-services:latest
    container_name: sild-filter
    restart: unless-stopped
    depends_on:
      - aion-mock
    command:
      - "python"
      - "-u"
      - "sild_mllp_filter.py"
      - "--listen"
      - "2575"
      - "--forward"
      - "aion-mock:2576"
      - "--log"
      - "/data/sild_reports.jsonl"
      - "--mode"
      - "log-only"
      - "--metrics-port"
      - "9100"
    ports:
      - "2575:2575"
      - "9100:9100"
    volumes:
      - sild-data:/data
    networks: [sild-net]

  # ===== SILD-Filter FHIR R4 =====
  sild-fhir-filter:
    build: .
    image: sild-stack/sild-services:latest
    container_name: sild-fhir-filter
    restart: unless-stopped
    depends_on:
      - aion-fhir-mock
    command:
      - "python"
      - "-u"
      - "sild_fhir_filter.py"
      - "--listen"
      - "8080"
      - "--forward"
      - "http://aion-fhir-mock:8081"
      - "--log"
      - "/data/sild_fhir_reports.jsonl"
      - "--mode"
      - "log-only"
      - "--metrics-port"
      - "9101"
    ports:
      - "8080:8080"
      - "9101:9101"
    volumes:
      - sild-data:/data
    networks: [sild-net]

  # ===== Lastgenerator HL7v2 =====
  load-generator:
    build: .
    image: sild-stack/sild-services:latest
    container_name: sild-load-generator
    restart: unless-stopped
    depends_on:
      - sild-filter
    command:
      - "python"
      - "-u"
      - "load_generator.py"
      - "--target"
      - "sild-filter:2575"
      - "--rate"
      - "1.5"
      - "--burst"
    networks: [sild-net]

  # ===== Lastgenerator FHIR =====
  fhir-load-generator:
    build: .
    image: sild-stack/sild-services:latest
    container_name: sild-fhir-load-generator
    restart: unless-stopped
    depends_on:
      - sild-fhir-filter
    command:
      - "python"
      - "-u"
      - "sild_fhir_sender.py"
      - "--target"
      - "http://sild-fhir-filter:8080"
      - "--dir"
      - "samples_fhir"
      - "--loop"
      - "--rate"
      - "1.0"
      - "--burst"
    networks: [sild-net]

  # ===== Prometheus =====
  prometheus:
    image: prom/prometheus:latest
    container_name: sild-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [sild-net]

  # ===== Grafana =====
  grafana:
    image: grafana/grafana:latest
    container_name: sild-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=sild-demo
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/sild_operations.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [sild-net]

networks:
  sild-net:
    driver: bridge

volumes:
  sild-data:
  prometheus-data:
  grafana-data:
